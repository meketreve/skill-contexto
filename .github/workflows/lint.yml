name: lint
on:
  push:
  pull_request:
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Syntax
        run: bash -n scripts/init.sh && bash -n scripts/install.sh && bash -n scripts/index.sh && bash -n scripts/hook.sh && bash -n .githooks/pre-commit
      - name: ShellCheck
        run: shellcheck -S warning scripts/init.sh scripts/install.sh scripts/index.sh scripts/hook.sh .githooks/pre-commit
      - name: Executable bit
        run: test -x scripts/init.sh && test -x scripts/install.sh && test -x scripts/index.sh && test -x scripts/hook.sh && test -x .githooks/pre-commit
      - name: Sync checks (templates, commands, frontmatter)
        run: |
          diff <(ls templates | sort) <(ls templates.en | sort)
          diff <(tail -n +9 commands/context.md) <(tail -n +9 commands/contexto.md)
          grep -q '^updated:' templates/MAP.md && grep -q '^tier:' templates/MAP.md
          grep -q '^updated:' templates.en/MAP.md && grep -q '^tier:' templates.en/MAP.md
          grep -q 'active:' templates/TODO.md && grep -q 'active:' templates.en/TODO.md
      - name: Smoke test (tiers 1-3, both langs)
        run: |
          rm -rf /tmp/smoke-pt /tmp/smoke-en /tmp/smoke-t3 /tmp/smoke-mono /tmp/smoke-proj /tmp/smoke-old /tmp/smoke-bmad /tmp/smoke-hist
          mkdir -p /tmp/smoke-pt /tmp/smoke-en /tmp/smoke-t3 /tmp/smoke-mono/packages/foo /tmp/smoke-proj /tmp/smoke-hist
          ./scripts/init.sh --tier 1 --lang pt --yes --dir /tmp/smoke-pt
          ./scripts/init.sh --tier 2 --lang en --yes --todo --dir /tmp/smoke-en
          ./scripts/init.sh --tier 3 --lang en --yes --dir /tmp/smoke-t3
          test -f /tmp/smoke-pt/.claude/context/MAP.md
          test -f /tmp/smoke-en/.claude/context/STATUS.md
          test -f /tmp/smoke-en/.claude/context/TODO.md
          ! grep -q "TODO.md" /tmp/smoke-en/CLAUDE.md            # inactive TODO is not imported
          test ! -f /tmp/smoke-t3/.claude/context/TODO.md       # no TODO without --todo
          grep -q "Project map" /tmp/smoke-en/.claude/context/MAP.md
          # tier 3: BUGS.md ships, WORKFLOW.md never blank
          test -f /tmp/smoke-t3/.claude/context/BUGS.md
          test ! -f /tmp/smoke-t3/.claude/context/WORKFLOW.md
          # tier 1 auto-block labels follow template language
          grep -q "gerado em" /tmp/smoke-pt/.claude/context/MAP.md
          # monorepo auto-detects tier 3
          ./scripts/init.sh --tier auto --yes --dir /tmp/smoke-mono | grep -q "tier=3"
          # tool dirs don't count: 250 files under _bmad/ must not push the tier (with
          # them counted this would be tier 3). With no TTY the 1-2 tie goes to 2, the
          # multi-session default; an explicit one-shot request still gives 1.
          mkdir -p /tmp/smoke-bmad/_bmad/.git && for i in $(seq 1 250); do : > /tmp/smoke-bmad/_bmad/f$i; : > /tmp/smoke-bmad/_bmad/.git/f$i; done
          ./scripts/init.sh --tier auto --yes --dir /tmp/smoke-bmad | grep -q "tier=2"
          CONTEXTO_ASSUME_MULTISESSAO=0 ./scripts/init.sh --tier auto --dir /tmp/smoke-bmad | grep -q "tier=1"
          git -C /tmp/smoke-hist init -q
          for d in 2026-09-27 2026-09-30; do GIT_AUTHOR_DATE=${d}T12:00 GIT_COMMITTER_DATE=${d}T12:00 git -C /tmp/smoke-hist -c user.name=ci -c user.email=ci@ci commit -q --allow-empty -m $d; done
          ./scripts/init.sh --tier auto --yes --dir /tmp/smoke-hist | grep -q "tier=2"
          # old format: warn, then --migrate keeps the text and adds frontmatter + auto block
          mkdir -p /tmp/smoke-old/.claude/context && printf '# Status\n\nOLD_MANUAL\n' > /tmp/smoke-old/.claude/context/STATUS.md
          ./scripts/init.sh --tier 2 --yes --dir /tmp/smoke-old 2>&1 | grep -q "old format: STATUS.md"
          ./scripts/init.sh --tier 2 --yes --migrate --dir /tmp/smoke-old
          head -1 /tmp/smoke-old/.claude/context/STATUS.md | grep -qx -- "---"
          grep -q "OLD_MANUAL" /tmp/smoke-old/.claude/context/STATUS.md
          test -f /tmp/smoke-old/.claude/context/STATUS.md.bak
          test "$(grep -c '<!-- auto:start -->' /tmp/smoke-old/.claude/context/STATUS.md)" = 1
      - name: Idempotency (re-run never overwrites manual content)
        run: |
          echo "MANUAL_LINE_DO_NOT_DELETE" >> /tmp/smoke-en/.claude/context/STATUS.md
          sed -i 's/^active: false/active: true/' /tmp/smoke-en/.claude/context/TODO.md
          ./scripts/init.sh --tier 2 --lang en --yes --dir /tmp/smoke-en
          grep -q "MANUAL_LINE_DO_NOT_DELETE" /tmp/smoke-en/.claude/context/STATUS.md
          grep -q "^active: true" /tmp/smoke-en/.claude/context/TODO.md
          grep -q "@.claude/context/TODO.md" /tmp/smoke-en/CLAUDE.md   # imported once active
          grep -q "^updated: $(date +%F)" /tmp/smoke-en/.claude/context/STATUS.md
          grep -q "^tier: 2" /tmp/smoke-en/.claude/context/STATUS.md
      - name: init.sh guards (data loss, CLI, portability, --check, bundle)
        run: |
          # An unbalanced auto block used to swallow the rest of the file, silently.
          D=/tmp/smoke-guard; rm -rf $D; mkdir -p $D/.claude/context
          printf -- '---\nupdated: 2020-01-01\ntier: 1\n---\n\n# Mapa\n\n<!-- auto:start -->\nvelho\n\n## A mao (NAO_PODE_SUMIR)\n' > $D/.claude/context/MAP.md
          ./scripts/init.sh --tier 1 --yes --dir $D 2>&1 | grep -q "unbalanced"
          grep -q 'NAO_PODE_SUMIR' $D/.claude/context/MAP.md
          # CLI validation
          ! ./scripts/init.sh --tier 7 --dir $D 2>/dev/null
          ! ./scripts/init.sh --lang xx --dir $D 2>/dev/null
          ! ./scripts/init.sh --tier 2>/dev/null
          # Portability: no GNU-only sed -i, and mktemp always gets a template
          ! grep -nE '^[^#]*sed -i' scripts/init.sh
          ! grep -nE 'mktemp\)' scripts/init.sh
          # A consumer that closes the pipe early must not abort the scaffold: with
          # pipefail this used to exit non-zero mid-run and leave half the files.
          P=/tmp/smoke-pipe; rm -rf $P; mkdir -p $P
          ( set -o pipefail; ./scripts/init.sh --tier 2 --yes --dir $P | head -1 >/dev/null )
          test -f $P/.claude/context/LEARNINGS.md
          test -f $P/CLAUDE.md
          # same for the installer's narration, which never touches $HOME with --list
          ( set -o pipefail; ./scripts/install.sh --list | head -1 >/dev/null )
          # --check writes nothing on a virgin project, and reports the missing file
          V=/tmp/smoke-virgin; rm -rf $V; mkdir -p $V; : > $V/a.txt
          ! ./scripts/init.sh --check --tier 1 --dir $V 2>/dev/null
          test ! -e $V/.claude
          # tier 3 stamps BUGS.md like every other context file
          T=/tmp/smoke-stamp; rm -rf $T; mkdir -p $T/apps/x
          ./scripts/init.sh --tier 3 --yes --dir $T >/dev/null
          grep -q "^updated: $(date +%F)" $T/.claude/context/BUGS.md
          # auto-block labels follow the template language
          P=/tmp/smoke-pt2; rm -rf $P; mkdir -p $P
          ./scripts/init.sh --tier 2 --lang pt --yes --dir $P >/dev/null
          grep -q '^data: ' $P/.claude/context/STATUS.md
          grep -q '^date: ' /tmp/smoke-en/.claude/context/STATUS.md
          # an empty packages/ is not a monorepo
          mkdir -p /tmp/smoke-empty-pkg/packages && : > /tmp/smoke-empty-pkg/a.txt
          ./scripts/init.sh --tier auto --yes --dir /tmp/smoke-empty-pkg | grep -q "tier=2"
          # the Run command must not depend on whether jq is installed (dev wins over start)
          J=/tmp/smoke-jq; rm -rf $J; mkdir -p $J
          printf '{"scripts":{"dev":"vite","start":"node .","build":"tsc","test":"vitest"}}\n' > $J/package.json
          ./scripts/init.sh --tier 1 --yes --dir $J >/dev/null
          grep -q 'npm run dev' $J/.claude/context/MAP.md
          # an existing STATUS.md keeps a fresh auto block even when the tier drops to 1
          S=/tmp/smoke-stale; rm -rf $S; mkdir -p $S
          ./scripts/init.sh --tier 2 --yes --dir $S >/dev/null
          sed -i 's/^data: .*/data: 1999-01-01/' $S/.claude/context/STATUS.md
          ./scripts/init.sh --tier 1 --yes --dir $S >/dev/null
          grep -q "^data: $(date +%F)" $S/.claude/context/STATUS.md
          # bundle: opt-in, mirrors the import policy, keeps user text, refreshes itself
          B=/tmp/smoke-bundle; rm -rf $B; mkdir -p $B; echo 'REGRA_DO_USUARIO' > $B/AGENTS.md
          ./scripts/init.sh --tier 2 --lang en --yes --bundle --dir $B >/dev/null
          grep -q 'REGRA_DO_USUARIO' $B/AGENTS.md
          test "$(grep -c '^<!-- from ' $B/AGENTS.md)" = 3
          grep -q '@.claude/context/LEARNINGS.md' $B/CLAUDE.md
          ./scripts/init.sh --check --tier 2 --lang en --dir $B
          cp $B/AGENTS.md /tmp/smoke-bundle-1.md
          ./scripts/init.sh --tier 2 --lang en --yes --dir $B >/dev/null   # no-op run
          diff -q /tmp/smoke-bundle-1.md $B/AGENTS.md                      # converged on run 1
          printf '\nBUNDLE_MUST_FOLLOW\n' >> $B/.claude/context/STATUS.md
          ./scripts/init.sh --tier 2 --lang en --yes --dir $B >/dev/null   # refreshes without --bundle
          grep -q 'BUNDLE_MUST_FOLLOW' $B/AGENTS.md
          ./scripts/init.sh --check --tier 2 --lang en --dir $B
          # --check also catches a stale code index, and never writes it
          I=/tmp/smoke-idxstale; rm -rf $I; mkdir -p $I/supabase/migrations
          printf 'create table public.um (id int);\n' > $I/supabase/migrations/001.sql
          ./scripts/init.sh --tier 2 --lang en --yes --index --dir $I >/dev/null
          ./scripts/init.sh --check --tier 2 --lang en --dir $I
          printf 'create table public.dois (id int);\n' > $I/supabase/migrations/002.sql
          ./scripts/init.sh --check --tier 2 --lang en --dir $I 2>&1 | grep -q 'index is stale'
          ! grep -q 'dois' $I/.claude/context/MAP.md          # --check wrote nothing
          ./scripts/init.sh --tier 2 --lang en --yes --dir $I >/dev/null
          ./scripts/init.sh --check --tier 2 --lang en --dir $I
          # --check catches a stale bundle, a placeholder date and an over-budget file
          sed -i 's/BUNDLE_MUST_FOLLOW/TAMPERED/' $B/AGENTS.md
          sed -i 's/^updated: .*/updated: AAAA-MM-DD/' $B/.claude/context/LEARNINGS.md
          seq 80 >> $B/.claude/context/STATUS.md
          ./scripts/init.sh --check --tier 2 --lang en --dir $B 2>&1 | grep -q 'bundle is stale'
          ./scripts/init.sh --check --tier 2 --lang en --dir $B 2>&1 | grep -q 'placeholder'
          ./scripts/init.sh --check --tier 2 --lang en --dir $B 2>&1 | grep -q 'budget 60'
          ! ./scripts/init.sh --check --tier 2 --lang en --dir $B 2>/dev/null
      - name: init.sh --index (code index block in MAP.md)
        run: |
          D=/tmp/smoke-idx; rm -rf $D
          mkdir -p $D/supabase/migrations $D/supabase/functions/pagar $D/supabase/functions/_shared $D/src $D/api
          printf 'create table public.pedidos (id int);\nalter table pedidos enable row level security;\ncreate policy "dono le"\n  on public.pedidos for select using (true);\ncreate table bairros (id int);\n' > $D/supabase/migrations/0001_init.sql
          printf 'create or replace function public.criar_pedido(p jsonb) returns int as $$ select 1 $$ language sql;\n' > $D/supabase/migrations/0002_rpc.sql
          : > $D/supabase/functions/pagar/index.ts; : > $D/supabase/functions/_shared/index.ts
          printf '<Route path="/r/:slug" element={<Loja />} />\n<Route path="*" element={<NotFound />} />\n' > $D/src/App.tsx
          printf "app.post('/webhook', h)\n" > $D/api/server.ts
          ./scripts/init.sh --tier 2 --lang en --yes --index --dir $D
          M=$D/.claude/context/MAP.md
          grep -q '<!-- auto:start index -->' $M
          grep -q 'pedidos  rls 1p  0001_init.sql:1' $M          # policy "on" on the next line counts
          grep -q 'bairros  NO-RLS 0p' $M
          grep -q 'criar_pedido  0002_rpc.sql:1' $M
          grep -q 'pagar  supabase/functions/pagar/index.ts:1' $M
          ! grep -q '_shared' $M                                  # helper dirs are not functions
          grep -q '/r/:slug  src/App.tsx:1' $M
          ! grep -q -- '- \*  ' $M                                # wildcard route skipped
          grep -q 'POST /webhook  api/server.ts:1' $M
          # RLS on a continuation line and FORCE are still RLS; a policy whose name
          # contains " on " counts for its own table; flat netlify functions appear.
          printf 'create table public.gama (id int);\nalter table public.gama\n  enable row level security;\ncreate policy "le on own" on public.gama for select using (true);\n' > $D/supabase/migrations/0004_rls.sql
          mkdir -p $D/netlify/functions && : > $D/netlify/functions/plano.ts
          ./scripts/init.sh --tier 2 --lang en --yes --dir $D
          grep -q 'gama  rls 1p  0004_rls.sql:1' $M
          grep -q 'plano  netlify/functions/plano.ts:1' $M
          # refreshed without the flag once present; budget awk skips both auto blocks
          printf 'create table extra (id int);\n' > $D/supabase/migrations/0003_extra.sql
          ./scripts/init.sh --tier 2 --lang en --yes --dir $D
          grep -q 'extra  NO-RLS' $M
          test "$(grep -c '<!-- auto:start index -->' $M)" = 1
          ! awk '/<!-- auto:start/{s=1} !s{print} /<!-- auto:end/{s=0}' $M | grep -q 'pedidos'
          # no --index, no block
          ! grep -q 'auto:start index' /tmp/smoke-pt/.claude/context/MAP.md
      - name: index.sh (entries, verdicts, multi-line match)
        run: |
          L=/tmp/smoke-en/.claude/context/LEARNINGS.md
          printf -- '- [2026-08-20] [net] [✗] free the name on close — never fires on minimize\n' >> "$L"
          printf -- '- [2026-08-23] [net] [✓] app heartbeat every 5 s\n  frees the name — tested on tablet\n' >> "$L"
          ./scripts/index.sh --dir /tmp/smoke-en | grep -q "LEARNINGS.md — 2 entries"
          ./scripts/index.sh --dir /tmp/smoke-en | grep -q "(✓1 ✗1)"
          ./scripts/index.sh --dir /tmp/smoke-en -x | grep -q "on close"
          ! ./scripts/index.sh --dir /tmp/smoke-en -x | grep -q "heartbeat"
          ./scripts/index.sh --dir /tmp/smoke-en tablet | grep -q "LEARNINGS.md:.*heartbeat"
          printf -- '- [2026-08-25] [ui] the [✗] icon is red\n' >> "$L"     # ✗ in the text is no verdict
          test "$(./scripts/index.sh --dir /tmp/smoke-en -x | grep -c 2026-08)" = 1
      - name: hook.sh (recall by file, budget, silence, valid JSON)
        run: |
          D=/tmp/smoke-en
          # The recall marker is "once per file per session" in the scratchpad; a stale
          # one from an earlier local run would silence the first assertion below.
          rm -f "${TMPDIR:-/tmp}"/contexto-recall-*
          printf -- '- [2026-08-24] [net] the "socket" lives in src/net.ts\n' >> $D/.claude/context/LEARNINGS.md
          j() { printf '{"session_id":"ci","cwd":"%s","scratchpad_dir":"/tmp","hook_event_name":"%s","tool_input":{"file_path":"%s"}}' "$D" "$1" "$2"; }
          j PreToolUse $D/src/net.ts | ./scripts/hook.sh | python3 -c 'import json,sys; assert "src/net.ts" in json.load(sys.stdin)["hookSpecificOutput"]["additionalContext"]'
          test -z "$(j PreToolUse $D/src/net.ts | ./scripts/hook.sh)"      # once per session
          test -z "$(j PreToolUse $D/src/other.ts | ./scripts/hook.sh)"    # nothing cites it
          test -z "$(j PostToolUse $D/.claude/context/STATUS.md | ./scripts/hook.sh)"  # under budget
          seq 80 >> $D/.claude/context/STATUS.md
          j PostToolUse $D/.claude/context/STATUS.md | ./scripts/hook.sh | grep -q "budget 60"
          echo 'not json' | ./scripts/hook.sh
      - name: install.sh matrix
        run: |
          ./scripts/install.sh --list
          ./scripts/install.sh --only claude --copy --force --uninstall || true
          cd /tmp/smoke-proj && "$GITHUB_WORKSPACE/scripts/install.sh" --only claude,opencode,agents --project
          test -d /tmp/smoke-proj/.claude/skills/contexto
          test -d /tmp/smoke-proj/.agents/skills/contexto
          test -d /tmp/smoke-proj/.opencode/skills/contexto
          test -f /tmp/smoke-proj/.opencode/commands/context.md
          test -f /tmp/smoke-proj/.opencode/commands/contexto.md
          # --uninstall --project undoes the project copies and never touches $HOME
          cd /tmp/smoke-proj && "$GITHUB_WORKSPACE/scripts/install.sh" --only claude,opencode,agents --project --uninstall
          test ! -e /tmp/smoke-proj/.claude/skills/contexto
          test ! -e /tmp/smoke-proj/.agents/skills/contexto
          test ! -e /tmp/smoke-proj/.opencode/skills/contexto
          test ! -e /tmp/smoke-proj/.opencode/commands/context.md
          test ! -e /tmp/smoke-proj/.opencode/commands/contexto.md
          # --only agents --project installs that target alone
          cd /tmp/smoke-proj && "$GITHUB_WORKSPACE/scripts/install.sh" --only agents --project
          test -d /tmp/smoke-proj/.agents/skills/contexto
          test ! -e /tmp/smoke-proj/.claude/skills/contexto
